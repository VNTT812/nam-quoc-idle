<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<title>Yên Tử F remaster · anim test</title>
<style>
  html,body{margin:0;background:#12141a;color:#f0e6c8;font:14px/1.4 system-ui,sans-serif}
  h1{font-size:16px;margin:12px 16px 4px;font-weight:600}
  p{margin:0 16px 10px;opacity:.75;font-size:12px}
  #wrap{display:flex;flex-wrap:wrap;gap:12px;padding:8px 16px 24px}
  .card{background:#1b2030;border:1px solid #2c3348;border-radius:8px;padding:10px 12px;min-width:280px}
  .card h2{margin:0 0 6px;font-size:13px;color:#ffd27a}
  canvas{image-rendering:pixelated;background:#1f5a32;border-radius:4px;display:block}
  .acts{display:flex;gap:8px;margin-top:8px}
</style>
</head>
<body>
<h1>Mythic đêm J — test anim (giữ n/d/w/h từ world.js)</h1>
<p>Mỗi card: idle · run · at · hurt · die · 8 hướng. Sheet: <code>img/a/&lt;stem&gt;_&lt;act&gt;.webp?v=302</code></p>
<div id="wrap"></div>
<script>
const MONS = [
  { n: 'Nhím', stem: 'ani019', anim: {
    st:{f:'ani019_st.webp?v=302',n:6,d:8,w:47,h:36,ax:23,ay:34,ms:143},
    run:{f:'ani019_run.webp?v=302',n:4,d:8,w:47,h:37,ax:23,ay:36,ms:71},
    at:{f:'ani019_at.webp?v=302',n:6,d:8,w:48,h:46,ax:24,ay:43,ms:62},
    hurt:{f:'ani019_hurt.webp?v=302',n:3,d:8,w:53,h:47,ax:26,ay:42,ms:83},
    die:{f:'ani019_die.webp?v=302',n:4,d:8,w:90,h:64,ax:45,ay:54,ms:100},
  }},
  { n: 'Heo rừng', stem: 'ani018', anim: {
    st:{f:'ani018_st.webp?v=302',n:6,d:8,w:54,h:43,ax:27,ay:41,ms:143},
    run:{f:'ani018_run.webp?v=302',n:8,d:8,w:59,h:46,ax:29,ay:44,ms:71},
    at:{f:'ani018_at.webp?v=302',n:7,d:8,w:79,h:52,ax:40,ay:44,ms:62},
    hurt:{f:'ani018_hurt.webp?v=302',n:3,d:8,w:71,h:49,ax:35,ay:44,ms:83},
    die:{f:'ani018_die.webp?v=302',n:6,d:8,w:68,h:52,ax:34,ay:43,ms:100},
  }},
  { n: 'Hoán hùng', stem: 'ani051', anim: {
    st:{f:'ani051_st.webp?v=302',n:8,d:8,w:38,h:27,ax:19,ay:26,ms:143},
    run:{f:'ani051_run.webp?v=302',n:5,d:8,w:49,h:33,ax:25,ay:32,ms:71},
    at:{f:'ani051_at.webp?v=302',n:6,d:8,w:49,h:38,ax:25,ay:37,ms:62},
    hurt:{f:'ani051_hurt.webp?v=302',n:4,d:8,w:48,h:29,ax:24,ay:29,ms:83},
    die:{f:'ani051_die.webp?v=302',n:7,d:8,w:55,h:34,ax:28,ay:32,ms:100},
  }},
  { n: 'Linh Miêu', stem: 'ani052', anim: {
    st:{f:'ani052_st.webp?v=302',n:8,d:8,w:47,h:29,ax:23,ay:28,ms:143},
    run:{f:'ani052_run.webp?v=302',n:5,d:8,w:47,h:29,ax:23,ay:26,ms:71},
    at:{f:'ani052_at.webp?v=302',n:5,d:8,w:59,h:47,ax:29,ay:41,ms:62},
    hurt:{f:'ani052_hurt.webp?v=302',n:4,d:8,w:48,h:32,ax:24,ay:31,ms:83},
    die:{f:'ani052_die.webp?v=302',n:7,d:8,w:46,h:33,ax:23,ay:28,ms:100},
  }},
];
const ACTS = ['st','run','at','hurt','die'];
const IMG = {};
function img(src){ let i=IMG[src]; if(!i){ i=new Image(); i.src='img/a/'+src; IMG[src]=i; } return i; }
function draw(cx, m, act, dir, t, x, y, sc){
  const meta = m.anim[act]; if(!meta) return;
  const im = img(meta.f); if(!im.complete || !im.naturalWidth) return;
  let fr = Math.floor(t*1000/meta.ms);
  if(act==='at'||act==='hurt'||act==='die') fr=Math.min(fr, meta.n-1); else fr%=meta.n;
  const d = dir % meta.d;
  cx.drawImage(im, fr*meta.w, d*meta.h, meta.w, meta.h, x-meta.ax*sc, y-meta.ay*sc, meta.w*sc, meta.h*sc);
}
const wrap = document.getElementById('wrap');
const cards = MONS.map(m => {
  const el = document.createElement('div'); el.className='card';
  el.innerHTML = `<h2>${m.n} · ${m.stem}</h2><div class="acts"></div>`;
  const row = el.querySelector('.acts');
  const cvs = ACTS.map(act => {
    const c = document.createElement('canvas');
    c.width = 120; c.height = 110; c.dataset.act = act;
    const lab = document.createElement('div');
    lab.style.cssText='text-align:center;font-size:11px;opacity:.7;margin-top:2px';
    lab.textContent = act;
    const box = document.createElement('div');
    box.appendChild(c); box.appendChild(lab);
    row.appendChild(box);
    return c;
  });
  wrap.appendChild(el);
  return { m, cvs };
});
// preload
MONS.forEach(m => ACTS.forEach(a => img(m.anim[a].f)));
let t0 = performance.now();
function tick(now){
  const t = (now - t0)/1000;
  const dir = Math.floor(t*1.2) % 8;
  for(const {m, cvs} of cards){
    cvs.forEach((c,i) => {
      const cx = c.getContext('2d');
      cx.clearRect(0,0,c.width,c.height);
      cx.fillStyle = '#1f5a32'; cx.fillRect(0,0,c.width,c.height);
      const act = ACTS[i];
      const once = (act==='at'||act==='hurt'||act==='die');
      const cycle = once ? (t % 1.6) : t;
      draw(cx, m, act, dir, cycle, 60, 95, 1.6);
    });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
