<!doctype html>
<html lang="vi"><head><meta charset="utf-8"/>
<title>Duyệt trang phục Trần</title>
<style>
body{margin:0;background:#121614;color:#e8e0d0;font:14px/1.4 system-ui,sans-serif}
header{padding:16px 20px;border-bottom:1px solid #2a3230}
header code{background:#1e2624;padding:2px 6px;border-radius:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px}
figure{margin:0;background:#1a201e;border:1px solid #2e3834;border-radius:8px;padding:10px;text-align:center}
figure[data-status=candidate]{border-color:#6a8f6a}
figure[data-status=active]{border-color:#8a6a3a}
img{image-rendering:pixelated;width:100%;max-width:260px;background:#0e1210}
figcaption{margin-top:8px} em{color:#9ab;font-style:normal;font-size:12px}
</style></head><body>
<header>
  <b>Duyệt trang phục thời Trần</b> — mẫu trên sơn tặc <code>enemy122</code><br/>
  <small>active = đang gắn game · candidate = bản mới chờ bạn chọn · goc = đối chiếu</small>
</header>
<div class="grid"><figure data-key="goc" data-status="reference"><img src="costume_goc.png" alt="goc"/><figcaption><b>goc</b> · Gốc<br/><small></small><br/><em>reference</em></figcaption></figure><figure data-key="day" data-status="active"><img src="costume_day.png" alt="day"/><figcaption><b>day</b> · Áo đay<br/><small>Sơn dân · nâu đay</small><br/><em>active</em></figcaption></figure><figure data-key="cham" data-status="active"><img src="costume_cham.png" alt="cham"/><figcaption><b>cham</b> · Áo chàm<br/><small>Lính tuần · chàm</small><br/><em>active</em></figcaption></figure><figure data-key="reu" data-status="active"><img src="costume_reu.png" alt="reu"/><figcaption><b>reu</b> · Áo rêu<br/><small>Phục kích · xanh rêu</small><br/><em>active</em></figcaption></figure><figure data-key="muc" data-status="active"><img src="costume_muc.png" alt="muc"/><figcaption><b>muc</b> · Áo mực<br/><small>Ám sát · mực đen</small><br/><em>active</em></figcaption></figure><figure data-key="son" data-status="active"><img src="costume_son.png" alt="son"/><figcaption><b>son</b> · Áo son<br/><small>Đầu lĩnh · đỏ son</small><br/><em>active</em></figcaption></figure><figure data-key="kim" data-status="active"><img src="costume_kim.png" alt="kim"/><figcaption><b>kim</b> · Áo kim<br/><small>Trùm cao · vàng nhạt</small><br/><em>active</em></figcaption></figure><figure data-key="bach" data-status="active"><img src="costume_bach.png" alt="bach"/><figcaption><b>bach</b> · Áo bạch<br/><small>Lụa trắng · văn quan</small><br/><em>active</em></figcaption></figure><figure data-key="lam" data-status="active"><img src="costume_lam.png" alt="lam"/><figcaption><b>lam</b> · Áo lam<br/><small>Lam nhạt · thư sinh</small><br/><em>active</em></figcaption></figure><figure data-key="dat" data-status="active"><img src="costume_dat.png" alt="dat"/><figcaption><b>dat</b> · Áo đất<br/><small>Nâu đất đậm · nông binh</small><br/><em>active</em></figcaption></figure><figure data-key="thao" data-status="active"><img src="costume_thao.png" alt="thao"/><figcaption><b>thao</b> · Áo thảo<br/><small>Vàng cỏ · dân dã</small><br/><em>active</em></figcaption></figure><figure data-key="huyen" data-status="active"><img src="costume_huyen.png" alt="huyen"/><figcaption><b>huyen</b> · Áo huyền<br/><small>Than tối · đặc sứ</small><br/><em>active</em></figcaption></figure><figure data-key="ngoc" data-status="active"><img src="costume_ngoc.png" alt="ngoc"/><figcaption><b>ngoc</b> · Áo ngọc<br/><small>Xanh ngọc · cận vệ</small><br/><em>active</em></figcaption></figure><figure data-key="hoang" data-status="active"><img src="costume_hoang.png" alt="hoang"/><figcaption><b>hoang</b> · Áo hoàng<br/><small>Hoàng y · cận thần</small><br/><em>active</em></figcaption></figure><figure data-key="tu" data-status="active"><img src="costume_tu.png" alt="tu"/><figcaption><b>tu</b> · Áo tử<br/><small>Tía dâu · quan võ</small><br/><em>active</em></figcaption></figure><figure data-key="dong" data-status="active"><img src="costume_dong.png" alt="dong"/><figcaption><b>dong</b> · Áo đồng<br/><small>Đồng hun · lính cung</small><br/><em>active</em></figcaption></figure><figure data-key="lua" data-status="active"><img src="costume_lua.png" alt="lua"/><figcaption><b>lua</b> · Áo lửa<br/><small>Cam lửa · cảm tử</small><br/><em>active</em></figcaption></figure><figure data-key="sam" data-status="active"><img src="costume_sam.png" alt="sam"/><figcaption><b>sam</b> · Áo sẫm<br/><small>Chàm sẫm · đêm</small><br/><em>active</em></figcaption></figure><figure data-key="ho" data-status="active"><img src="costume_ho.png" alt="ho"/><figcaption><b>ho</b> · Áo hổ<br/><small>Nâu hổ · dũng sĩ</small><br/><em>active</em></figcaption></figure></div>
